<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For You ❤️</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    font-family:system-ui,"Noto Sans Myanmar",sans-serif;
    background:linear-gradient(135deg,#ffd6e7,#fff0f5);
    color:#5b1835; overflow:hidden;
  }
  .card{
    width:min(90%,430px); padding:34px 24px; text-align:center;
    background:rgba(255,255,255,.82); border-radius:28px;
    box-shadow:0 15px 45px rgba(100,20,60,.15);
  }
  .heart{font-size:64px; animation:pulse 1.2s infinite}
  h1{margin:8px 0 16px;font-size:30px}
  p{font-size:18px;line-height:1.8;margin:10px 0}
  .from{margin-top:22px;font-weight:700}
  @keyframes pulse{50%{transform:scale(1.12)}}
  .small{font-size:13px;opacity:.7;margin-top:18px}
</style>
</head>
<body>
  <main class="card">
    <div class="heart">❤️</div>
    <h1>For My Favorite Girl</h1>
    <p>သာကြီးတို့ လီးပဲ။</p>
    <p>Fuck You🖕 </p>
    <p>🖕🖕🖕🖕🖕🖕</p>
    <div class="from">With love 💌</div>
    <div class="small">Made with Python/HTML practice ✨</div>
  </main>
</body>
</html>
