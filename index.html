<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Random Number</title>

<style>
body {
    text-align: center;
    font-family: Arial;
    background: #eee;
    padding-top: 50px;
}

.wheel {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    margin: 40px auto;

    background: conic-gradient(
        red, orange, yellow, green,
        blue, purple, red
    );

    display: flex;
    justify-content: center;
    align-items: center;

    box-shadow: 0 5px 20px #888;
}

.number {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: white;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 70px;
    font-weight: bold;
}

.spinning {
    animation: spin 0.4s linear infinite;
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

button {
    padding: 15px 40px;
    font-size: 22px;
    border: 0;
    border-radius: 10px;
    background: blue;
    color: white;
}
</style>
</head>

<body>

<h1>🎯 Random Number</h1>

<div class="wheel" id="wheel">
    <div class="number" id="number">?</div>
</div>

<button onclick="spin()">Spin Wheel</button>

<script>
function spin() {

    const wheel = document.getElementById("wheel");
    const number = document.getElementById("number");

    wheel.classList.add("spinning");
    number.innerText = "?";

    setTimeout(function() {

        let result = Math.floor(Math.random() * 10);

        wheel.classList.remove("spinning");

        number.innerText = result;

    }, 3000);
}
</script>

</body>
</html>
