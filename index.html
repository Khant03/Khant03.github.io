<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3 Digit Random Wheel</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
      padding-top: 40px;
    }

    h1 {
      font-size: 28px;
    }

    .wheel {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      margin: 30px auto;
      background: conic-gradient(
        #ff5252,
        #ffca28,
        #66bb6a,
        #42a5f5,
        #ab47bc,
        #ff5252
      );

      display: flex;
      align-items: center;
      justify-content: center;

      transition: transform 3s ease-out;
      box-shadow: 0 5px 15px #999;
    }

    .number {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 32px;
      font-weight: bold;
    }

    button {
      font-size: 20px;
      padding: 12px 30px;
      border: none;
      border-radius: 10px;
      background: #2196f3;
      color: white;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.95);
    }

    #result {
      margin-top: 25px;
      font-size: 30px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>🎯 3 Digit Random Wheel</h1>

  <div class="wheel" id="wheel">
    <div class="number" id="number">000</div>
  </div>

  <button onclick="spin()">လှည့်မယ်</button>

  <div id="result">Result: ---</div>

  <script>
    let rotation = 0;

    function spin() {

      // 000 - 999 ထဲက random number
      let randomNumber = Math.floor(Math.random() * 1000);

      // 3 လုံးဖြစ်အောင်
      let result = String(randomNumber).padStart(3, "0");

      // Wheel လှည့်
      rotation += 1440 + Math.floor(Math.random() * 360);

      document.getElementById("wheel").style.transform =
        `rotate(${rotation}deg)`;

      // လှည့်ပြီးနောက် result ပြ
      setTimeout(function() {
        document.getElementById("number").innerText = result;
        document.getElementById("result").innerText =
          "Result: " + result;
      }, 3000);
    }
  </script>

</body>
</html>
